name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fitnessapp
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: fitnessdb
        ports:
          - 5432:5432
        # Without this the job starts as soon as the container exists, not when
        # Postgres is accepting connections - a classic source of intermittent
        # "connection refused" failures on the first test.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # The fixture creates this database itself via Migrate().
      FITNESS_TEST_DB: Host=localhost;Port=5432;Database=fitnessdb_test;Username=fitnessapp;Password=devpassword

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Test
        run: dotnet test --no-restore --verbosity normal

  mobile:
    name: Mobile checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install
        run: npm ci

      # Type errors have been real bugs here, and checking is free.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test
